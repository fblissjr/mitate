# mitate showcase — Netlify config
# Static site. The only build step stages the skill's example scenes into
# films/ — they are tracked once, as plugin/skills/mitate/examples/, so the
# site and the skill can never drift into two different versions of a film.

[build]
  publish = "."
  command = "../scripts/stage-films.sh"

# Films: cache but ALWAYS revalidate. Filenames are stable (not
# content-addressed) and films update in place, so any positive max-age is a
# window where a phone replays yesterday's film and an update looks unshipped
# — measured: the boot card reached every film on the server while a phone
# still showed it on one. `no-cache` keeps the local copy and spends one 304
# round trip to confirm it; an updated film arrives immediately.
[[headers]]
  for = "/films/*"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/posters/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
