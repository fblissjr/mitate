# The gate, run unattended on the path nobody runs by hand.
#
# This exists because of 0.16.16. The console-noise allow-list in smoke.js
# matched neither of the two messages it most needed to, so every 3D scene
# failed on the default WebGL2 path — the whole shipped corpus, on the one path
# documented as CI-safe. It stayed invisible for releases because nothing ran
# that path unattended and development runs WEBGPU=metal, where neither message
# is emitted at all. The absence of CI was not a documentation gap; it was
# masking a broken gate on the path CI would use.
#
# So the browser job deliberately pins NOTHING: no WEBGPU, no ANGLE_BACKEND.
# That is the fallback path, and running it here is the whole point. Do not
# "fix" a failure in this workflow by setting a backend env var.
#
# NOR by moving to a bigger runner. These runners have no GPU, so Chromium runs
# software GL on a modest shared CPU, and that slowness is an ASSET: it is the
# only reason the capture race in 0.16.28 was ever observed. That race reached
# every frame of every recorded MP4 through shoot.js, where nothing sampled for
# it, and a faster machine would have hidden it rather than fixed it. Upgrading
# the runner to get a green board is "make the check pass by touching what it
# measures" in its purest form.
#
# ONE job. The cheap checks moved to static.yml once this workflow's real cost
# was measured — they fail for different reasons and have wildly different
# prices, and bundling them made every docs-only commit pay for a browser.
#
# MEASURED on ubuntu-latest, 2026-07-30, five runs on the pre-container config:
#   static.yml            8s        every push, unfiltered
#   this workflow    ~6m30s         measured 2026-08-02 (393s). This line read
#                                  3m04s-5m05s until then, which was the figure
#                                  before the workspace grew; of that, smoke over 8 scenes; the
#                                   chromium install it used to do (22s + apt)
#                                   is gone, the image carries the browsers
# No figure is recorded for the container config yet — the first run of it is
# the measurement, and the pull cost is unknown until then. Do not quote one.
#
# It earned itself on its first run and the finding is now closed. The
# determinism failures it surfaced (materials.html, then menagerie.html) were a
# CAPTURE RACE in the gate, not scene state: measured 40%/30%/20% on three cells
# with a bare seek, 0 of 200 once the seek and a GPU readback shared a task. Fixed
# in backend.js's seekSynced, 0.16.28. Two shipped films were wrongly accused in
# the meantime; the chain is in references/materials.md and
# docs/postmortems/2026-07-29_span_instrument-hardening.md.
#
# The first three runs also revealed that the `brackets` step was SKIPPED every
# time, because a step after a failing step is skipped by default — hence the
# `!cancelled()` below.
#
name: gate

on:
  push:
    # `branches: [main]` because push and pull_request BOTH fired on an
    # unfiltered push trigger, so every push to a branch with an open PR paid for
    # two full gate runs of the same commit. Branch work is now free until a PR
    # opens, which is also when a second opinion is worth three minutes.
    branches: [main]
    # Skipped when a commit touches ONLY prose. A .md edit cannot break a scene,
    # and paying 3 minutes of browser time for a changelog entry is how a gate
    # becomes something people route around. Fence parity and every doc check
    # live in static.yml, which is not filtered and runs regardless.
    paths-ignore: ['**/*.md', 'docs/**', 'site/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'site/**']
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (smoke on the WebGL2 fallback)
    runs-on: ubuntu-22.04
    # PINNED, not `ubuntu-latest`. The reason is the materials.html determinism
    # failure: it failed three runs, then passed twice with a CI change
    # confounding the sample, and "byte-identical within one backend" quietly
    # meant "on whatever ubuntu-latest happened to be today". Naming the runner
    # is the cheap half of fixing that.
    #
    # The expensive half was tried and REJECTED on measurement. A
    # mcr.microsoft.com/playwright container pins the OS and driver stack too,
    # and was committed here briefly — then measured at **2.31 GB**, of which
    # chromium is 958 MB and firefox (270 MB) plus webkit (273 MB) are browsers
    # this project will never open. GitHub gives each job a fresh VM, so that is
    # a full pull EVERY run, replacing a 22-second install of the one browser we
    # need. The container's other two justifications did not survive either: it
    # does not remove the download, it multiplies it; and it does not give a
    # local repro, because this is an arm64 host and the runners are amd64, so a
    # local run is a third environment rather than a reproduction.
    #
    # What remains unpinned here: the Mesa/GL driver stack inside the runner
    # image. That is the variable materials.html implicates, and it is NOT
    # addressed. Characterizing that failure needs repeated runs, not a heavier
    # environment — see references/materials.md.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A workspace built the way the skill tells a user to build one: the
      # tooling resolves three and playwright-core from where the film is being
      # built, never from the plugin. Examples ship vendored, so three is here
      # only for the templates, which smoke auto-bundles into .smoke-PID copies.
      - name: workspace
        run: |
          mkdir -p ws
          cp plugin/skills/mitate/templates/{shoot.js,build.js,smoke.js,backend.js} ws/
          cp plugin/skills/mitate/templates/*.template.html ws/
          cp plugin/skills/mitate/examples/*.html ws/
          cd ws && bun add three@0.185.1 playwright-core@1.61.1

      # No WEBGPU. No ANGLE_BACKEND. This is the path that was broken.
      - name: smoke
        run: cd ws && bun run smoke.js

      # Every bracket under templates/ — the count is not written here, because a
      # count in a comment goes stale the next time one lands, and this one had:
      # it read "all three" while four were globbed. The controls are the reason a
      # green gate means anything, and an unrunnable control is the defect this
      # repo has already eaten once (rule 5's repro was cited as preserved and is
      # not in the tree). Running them here is how they stay runnable.
      # bracket-noise pins the fallback path itself, so it is meaningful wherever
      # it runs.
      #
      # SCOPED TO templates/ ON PURPOSE, and this is the half that bit: the
      # brackets over the repo's own tools live in scripts/, need the repo rather
      # than a scene workspace, and need no browser. They run in static.yml. Until
      # 0.16.37 they ran nowhere, because "globbed" was read as "all of them".
      - name: brackets
        # `!cancelled()` because a step after a FAILED step is skipped by
        # default, and that is exactly what happened: the brackets were added
        # here to keep them runnable and were skipped in all three of the first
        # runs, because smoke fails first. A control that does not run is the
        # defect this workflow exists to prevent, reintroduced by step ordering.
        # The brackets are independent of smoke's verdict; they must run anyway.
        if: '!cancelled()'
        # Globbed, not listed: a hardcoded set means a NEW bracket silently
        # never runs here, which is how a control goes decorative.
        #
        # EVERY BRACKET RUNS EVEN WHEN ONE FAILS, and that rule now lives in ONE
        # place — scripts/run-brackets.sh, called by static.yml too. It was
        # duplicated here, so 0.16.41's `bash -e` defect (bracket-commands
        # failed, and determinism, liveplay, noise and parity never ran) had to
        # be fixed at two call sites instead of once underneath. That is the
        # same shape as the `!cancelled()` defect directly above, one level
        # down, and fixing it in two places is how it came back at all.
        #
        # NODE_PATH is exported rather than passed: the workspace's node_modules
        # is this job's environment, not part of the loop's logic, which is why
        # extracting the loop did not have to carry it.
        run: |
          cd ws
          export NODE_PATH="$PWD/node_modules"
          ../scripts/run-brackets.sh '../plugin/skills/mitate/templates/bracket-*.js'

      # Only on failure, so the green path pays nothing. Turns "seekTo(5.36) not
      # deterministic" into which grid cells moved and whether it is localized to
      # one object or spread across the frame — the difference between a lead and
      # a three-minute blind run. Needed because this failure does not reproduce
      # on macOS, so CI is the only instrument that sees it.
      - name: diagnose (only when smoke failed)
        if: failure()
        run: |
          cd ws && NODE_PATH="$PWD/node_modules" \
            bun run ../scripts/diagnose-determinism.js materials.html 5.36

      - name: upload diagnostic frames
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-diagnostic
          path: ws/diag-*.png
          if-no-files-found: ignore
