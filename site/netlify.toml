# mitate showcase — Netlify config
# Static site. The only build step stages the skill's example scenes into
# films/ — they are tracked once, as plugin/skills/mitate/examples/, so the
# site and the skill can never drift into two different versions of a film.

[build]
  publish = "."
  command = "./stage-films.sh"

# Cache film + poster assets. Filenames are stable (NOT content-addressed), so no
# `immutable` — an in-place update is still picked up on the next revalidate.
[[headers]]
  for = "/films/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/posters/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
