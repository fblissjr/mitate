# Manual instrument, never automatic. Measures the RATE of the in-session
# determinism failure per scene and per t, and — the part that matters —
# discriminates a real scene defect from a capture race.
#
# It answered the question it was built for: the gate's determinism failures were
# a capture race, not scene state. Measured 2026-07-30 on ubuntu-22.04/WebGL2, 10
# repeats — 40%/30%/20% on three cells with `no_canvas: true` (screenshots only,
# what smoke compares), against 0 of 200 in the readback mode. The readback was
# the only variable, which is a completion barrier, which is a race.
#
# It is KEPT, as the regression instrument for that fix: `no_canvas: true` must
# now come back 0/200. Anything else means backend.js's seekSynced is still short
# on this stack. It is the only way to verify — the failure does not reproduce on
# macOS (0 in 80).
#
# NOT on push. This is a diagnostic, and a diagnostic that runs unbidden becomes
# noise that people learn to ignore — the failure mode already tracked for the
# crushed-exposure threshold.
#
# The concurrency group deliberately includes run_id, so repeated dispatches do
# NOT cancel each other. gate.yml's group intentionally does the opposite: there,
# superseding an in-flight run of an older commit is correct. Here, cancelling a
# sibling would destroy exactly the sample being gathered.
name: sample-determinism

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Samples per scene per timestamp
        required: false
        default: '10'
      no_canvas:
        description: >
          Screenshots only, no in-page readback. This is the mode that reproduces
          the race and therefore the one that verifies the fix — set it true.
          The default (false) inserts a readback and is now known to mask the
          failure, which is what identified the mechanism.
        required: false
        default: 'false'

concurrency:
  group: sample-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sample:
    name: determinism rate (Linux WebGL2)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Examples only: they ship vendored, so three is not needed and the
      # templates are not what failed.
      - name: workspace
        run: |
          mkdir -p ws
          cp plugin/skills/mitate/templates/backend.js ws/   # all the sampler requires
          cp plugin/skills/mitate/examples/*.html ws/
          cd ws && bun add playwright-core@1.61.1

      - name: chromium
        run: cd ws && bunx playwright install --with-deps chromium

      # No WEBGPU: the fallback path is where the failure lives.
      - name: sample
        run: |
          cd ws && NODE_PATH="$PWD/node_modules" \
            bun run ../scripts/sample-determinism.js --repeats ${{ inputs.repeats }} \
              ${{ inputs.no_canvas == 'true' && '--no-canvas' || '' }}
