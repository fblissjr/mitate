# The cheap stage: no browser, runs on EVERY push. Whole-job wall time 18-27s
# across the four runs of 2026-08-02 (includes checkout and bun setup; an
# earlier "~8 seconds" here was measured before the brackets and
# cross-reference steps existed and sat unrevised while the job grew).
#
# Deliberately NOT path-filtered. It checks docs as much as code — the version
# cascade, the "last updated" markers, subtree link resolution, the provenance
# headers — so a docs-only commit is exactly when it has the most to say.
#
# Split out of gate.yml once the browser gate's real cost was measured: 2m36s of
# smoke over 8 scenes, paid by eleven consecutive commits that touched no scene
# at all. Fast feedback belongs on every push; a 3-minute browser gate does not.
name: static

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (lint + fence parity)
    runs-on: ubuntu-latest
    steps:
      # Full history: the self-check compares each doc's `last updated:` marker
      # against its last commit date, and a shallow clone reports the tip commit
      # for every file, which would make every marker look stale.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # no-undef is OFF in oxlint's defaults — .oxlintrc.json turns it on, and
      # that one rule is the whole reason this step exists. Pinned via bunx so
      # the repo needs no root manifest and the result stays reproducible.
      - name: lint
        run: bunx oxlint@1.76.0 -c .oxlintrc.json plugin/skills/mitate/templates/

      # The instrument pointed at the repo's own claims: version cascade, the
      # three pin and its per-scene stamps, subtree link resolution, provenance
      # headers, the measurement-assertion ratchet, and that every bracket has a
      # failing exit path. No browser, no node_modules, ~instant.
      - name: self-check
        run: bun run scripts/selfcheck.js

      # Three globs so EVERY carrier directory is in the scan. Since 0.17.0
      # each carrier is checked against the canonical store
      # (templates/fences/), so the globs are scope, not comparison structure —
      # the old rationale here ("a per-directory green does not cover the
      # template-to-example boundary") described the cross-carrier check this
      # step no longer runs. site/films/gearbox-neon.html WAS an argument here
      # until 0.16.35 made that copy derived; dropping it loses no coverage,
      # and that is MEASURED rather than assumed (re-verified 2026-08-02
      # against every fence gearbox carries — six, CONTRACT included; the
      # previous version of this comment listed five with hand-written line
      # indexes, both stale): the one line the derivation seds
      # (`const STYLE = BIBLES.workshop;`) sits outside every fence, so the
      # variant's fences are byte-identical to gearbox.html's, which is
      # scanned against the store. Re-running parity with the neon included
      # still reports ok.
      - name: fence parity
        run: |
          bun run plugin/skills/mitate/templates/smoke.js --parity-only \
            plugin/skills/mitate/templates/*.html \
            plugin/skills/mitate/examples/*.html \
            scenes/*.html \
            fixtures/defect-corpus/*.html

      # The controls, globbed so a new one is covered the day it is written. They
      # ran nowhere until 0.16.37: gate.yml globs templates/ only, so the bracket
      # over selfcheck.js -- the repo's own claim-checker -- had never executed in
      # CI. Both are browser-free, which is why they belong in the cheap job.
      # Neither writes anything tracked: bracket-stage-films.js drives
      # stage-films.sh at a throwaway fixture via MITATE_EXAMPLES/MITATE_FILMS.
      # It used to rewrite the real 1.14 MB gearbox.html and restore it, which
      # risked a shipped artifact to control a script that only serves the site.
      # The loop lives in scripts/run-brackets.sh, called by BOTH workflows. It
      # was copy-pasted here and in gate.yml along with ~10 lines of the same
      # prose, so the `bash -e` trap had to be fixed twice -- which is how the
      # `!cancelled()` defect reappeared one level down. Its own control is
      # scripts/bracket-run-brackets.js, and it runs in the glob below.
      #
      # QUOTE THE GLOB: the script expands it, so an unmatched pattern is caught
      # there and fails loudly rather than being expanded away by this shell.
      # `build.js check` ran NOWHERE in CI against a real scene until 0.16.70. Its
      # bracket (under templates/, so gate.yml runs it) exercises it against
      # synthetic fixtures and mutated copies -- which proves the verb works and
      # proves nothing about the scenes that ship. A shipped scene developing a
      # table error would have reached a user.
      #
      # It belongs HERE rather than in gate.yml because it needs no browser: the
      # whole run is milliseconds of string parsing, so it costs this job almost
      # nothing and runs on every push instead of on the filtered set.
      #
      # THE CORPUS FIXTURE IS INCLUDED. The fence-parity step above has read it
      # as text since its third glob arm landed (0.16.45); what THIS step buys
      # is its declarative tables evaluated on every push. Be honest about the
      # size of that: `check` exits 0 on a warning, and the corpus's
      # check-visible signature IS a warning (row 10b's repeat framing), so
      # this is visibility in the log, not a gate. The gate is
      # templates/bracket-corpus.js (0.18.1): it runs in gate.yml's bracket
      # loop, walks up from the workspace to fixtures/, drives after-hours.html
      # through a full smoke run, and pins the VERIFIED rows' signatures --
      # the expected verdict asserted, red when it moves in either direction.
      # Until 2026-08-04 this comment said that bracket was "still unbuilt"
      # and the fixture was "executed in a browser by nothing" -- both false
      # from the evening 0.18.1 landed. A comment asserting a control's
      # absence rots exactly like one asserting its presence.
      #
      # One scene per invocation, so it is a loop; `set -e` would stop at the
      # first failure and hide the rest, which is the defect run-brackets.sh
      # exists to avoid one tier up. Every scene is checked, then the job fails.
      - name: declarative cross-reference
        run: |
          fail=0
          for f in plugin/skills/mitate/templates/*.template.html \
                   plugin/skills/mitate/examples/*.html \
                   scenes/*.html \
                   fixtures/defect-corpus/*.html; do
            bun run plugin/skills/mitate/templates/build.js check "$f" || fail=1
          done
          exit $fail

      - name: brackets
        run: ./scripts/run-brackets.sh 'scripts/bracket-*.js'
