# mitate showcase — Netlify config
# Static site. The only build step stages the skill's example scenes into
# films/ — they are tracked once, as plugin/skills/mitate/examples/, so the
# site and the skill can never drift into two different versions of a film.

[build]
  publish = "."
  command = "../scripts/stage-films.sh"

# Cache film, clip and poster assets. Filenames are stable (NOT content-addressed),
# so no `immutable` — an in-place update is still picked up on the next revalidate.
[[headers]]
  for = "/films/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The thumbnail loops. Byte-for-byte the largest thing the site serves, and the
# most re-requested, so they get the same day-long window as the films.
[[headers]]
  for = "/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/posters/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
